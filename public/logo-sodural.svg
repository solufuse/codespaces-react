<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="120" y2="120" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0a2140" />
      <stop offset="100%" stop-color="#040b17" />
    </linearGradient>
    <linearGradient id="cyanGlow" x1="15" y1="15" x2="105" y2="105" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#5ce1e6" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Outer High-Voltage Hexagon Frame -->
  <polygon
    points="60,6 108,33 108,87 60,114 12,87 12,33"
    fill="url(#bgGrad)"
    stroke="url(#cyanGlow)"
    stroke-width="3.5"
  />
  <polygon
    points="60,14 101,37 101,83 60,106 19,83 19,37"
    fill="none"
    stroke="#8fcaff"
    stroke-opacity="0.28"
    stroke-width="1"
    stroke-dasharray="4 3"
  />

  <!-- Top & Bottom HV Busbars (SLD Symbol) -->
  <line x1="30" y1="34" x2="90" y2="34" stroke="#8fcaff" stroke-width="3" stroke-linecap="round" />
  <line x1="30" y1="86" x2="90" y2="86" stroke="#8fcaff" stroke-width="3" stroke-linecap="round" />

  <!-- Busbar Nodes -->
  <circle cx="36" cy="34" r="3" fill="#5ce1e6" />
  <circle cx="84" cy="34" r="3" fill="#5ce1e6" />
  <circle cx="36" cy="86" r="3" fill="#5ce1e6" />
  <circle cx="84" cy="86" r="3" fill="#5ce1e6" />

  <!-- 50Hz Sinusoidal / Transient Wave -->
  <path
    d="M 24 60 C 36 36, 48 36, 60 60 C 72 84, 84 84, 96 60"
    stroke="#5ce1e6"
    stroke-opacity="0.45"
    stroke-width="2.2"
    fill="none"
  />

  <!-- High-Voltage Lightning / S-Bolt Emblem -->
  <path
    d="M 66 22 L 42 57 L 61 57 L 54 98 L 78 63 L 59 63 Z"
    fill="#ffb74d"
    stroke="#fff4e0"
    stroke-width="1.2"
    stroke-linejoin="round"
    filter="url(#glow)"
  />
</svg>

